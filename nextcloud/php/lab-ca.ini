; The Mail app reaches Stalwart over PHP's own TLS streams, which consult
; neither the system trust store nor the certificates imported with
; occ security:certificates:import. Without this, IMAP fails with
; "Error connecting to mail server" and nothing reaches Stalwart at all.
; The file is the image's own roots plus the lab CA, so public trust is kept.
openssl.cafile = /certs/ca-bundle-nextcloud.pem
